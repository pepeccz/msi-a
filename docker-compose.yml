services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: msia-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-msia_db}
      POSTGRES_USER: ${POSTGRES_USER:-msia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - msia-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-msia} -d ${POSTGRES_DB:-msia_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis cache and pub/sub (with RedisSearch for LangGraph checkpointer)
  redis:
    image: redis/redis-stack:latest
    container_name: msia-redis
    command: redis-stack-server --requirepass ${REDIS_PASSWORD} --save 900 1 --appendonly no --maxmemory 384mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - msia-network
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # API service: FastAPI webhook receiver
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: msia-api
    env_file: .env
    environment:
      # For Windows Docker Desktop: enable TCP in Docker Desktop settings
      # then uncomment the following line:
      # - DOCKER_HOST=tcp://host.docker.internal:2375
      - DOCKER_HOST=${DOCKER_HOST:-}
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - msia-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Ollama: Local LLM server
  ollama:
    image: ollama/ollama:latest
    container_name: msia-ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - msia-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Ollama model setup: Downloads required models on startup
  # 2-tier architecture:
  #   - gemma4:e4b: Tier 1 - Fast local (classification, extraction, constraint validation)
  ollama-setup:
    image: ollama/ollama:latest
    container_name: msia-ollama-setup
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - msia-network
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "=== MSI-a 2-tier Hybrid LLM Architecture Setup ==="
        echo ""
        echo "Pulling Tier 1 model (fast): gemma4:e4b..."
        ollama pull gemma4:e4b
        echo ""
        echo "=== All models downloaded successfully! ==="
        echo "Tier 1 (gemma4:e4b): Vehicle classification, section mapping, constraint validation"
        echo "Tier 2 (OpenRouter): Complex queries, agent conversation"
    environment:
      - OLLAMA_HOST=ollama:11434

  # Agent service: LangGraph orchestrator
  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    container_name: msia-agent
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      # ollama: removed - now optional (will fallback gracefully if unavailable)
    volumes:
      - ./uploads:/app/uploads
    networks:
      - msia-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; import redis; r=redis.Redis(host='redis', port=6379, password=os.environ.get('REDIS_PASSWORD')); r.ping()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Admin Panel: NextJS + React modern admin interface
  admin-panel:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin-panel
    container_name: msia-admin-panel
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_CHATWOOT_URL=${CHATWOOT_API_URL:-http://localhost:3000}
    ports:
      - "8001:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - msia-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G

  # GC Scheduler: Weekly garbage collection for stale conversation data
  gc-scheduler:
    image: alpine:3.20
    container_name: msia-gc-scheduler
    depends_on:
      api:
        condition: service_healthy
    networks:
      - msia-network
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Install curl and set up weekly cron job
        apk add --no-cache curl
        echo "0 3 * * 0 curl -s -X POST http://api:8000/admin/gc/run -H 'Content-Type: application/json' -H 'Authorization: Bearer $${GC_API_TOKEN}' -d '{\"dry_run\": false, \"retention_days\": $${GC_RETENTION_DAYS:-90}}' >> /proc/1/fd/1 2>&1" > /etc/crontabs/root
        echo "GC cron installed: weekly Sunday 3:00 AM (retention=$${GC_RETENTION_DAYS:-90} days)"
        crond -f -l 2
    environment:
      - GC_API_TOKEN=${GC_API_TOKEN:-}
      - GC_RETENTION_DAYS=${GC_RETENTION_DAYS:-90}
    profiles:
      - gc

  # Test Runner: Execute pytest tests in Docker environment
  test-runner:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
    container_name: msia-test-runner
    env_file: .env
    environment:
      - ENVIRONMENT=test
      - LOG_LEVEL=INFO
      - PYTHONPATH=/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - msia-network
    volumes:
      # Mount entire project directory to ensure all source code is available
      - .:/app
    command: >
      sh -c "
        echo '=== Installing test dependencies ===' &&
        pip install --no-cache-dir pytest-cov coverage &&
        echo '=== Running Phase 1 defensive validation tests ===' &&
        pytest tests/agent/utils/test_tool_validation.py tests/agent/modes/test_base_mode_validation.py -v --tb=short --cov=agent.utils.tool_validation --cov=agent.modes.base_mode --cov-report=term-missing --cov-report=html:/app/tests/htmlcov --cov-report=json:/app/tests/coverage.json &&
        echo '=== Test execution complete ===' &&
        echo '=== Coverage report available at tests/htmlcov/index.html ===' &&
        tail -f /dev/null
      "
    restart: "no"
    profiles:
      - test

networks:
  msia-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ollama_data:
